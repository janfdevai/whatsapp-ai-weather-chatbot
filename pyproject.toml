[project]
name = "whatsapp-ai-weather-chatbot"
version = "0.1.0"
description = "A production-ready AI-powered WhatsApp weather chatbot built with FastAPI, LangGraph, and LangChain."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentevals>=0.0.9",
    "fastapi[standard]>=0.128.0",
    "google-genai>=1.60.0",
    "langchain>=1.2.6",
    "langchain-openai>=1.1.7",
    "langgraph>=1.0.7",
]
